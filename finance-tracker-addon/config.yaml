name: "Personal Finance Tracker"
version: "1.0.20"
slug: "finance_tracker"
description: "Track personal income, expenses and savings across a financial year"
arch:
  - amd64
url: "https://github.com/prapar2/ExpenseTracker"
ingress: true
ingress_port: 3001
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: "Web UI"
ingress_entry: /
map:
  - type: data
    read_only: false
panel_icon: "mdi:currency-inr"
panel_title: "Finance Tracker"
startup: application
boot: auto
image: "ghcr.io/prapar2/finance-tracker-addon/{arch}"
init: false
options:
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  GOOGLE_OAUTH_REDIRECT_URI: ""
  BACKUP_ENABLED: false
  BACKUP_SYSTEM_NAME: "home-assistant"
schema:
  GOOGLE_OAUTH_CLIENT_ID: str
  GOOGLE_OAUTH_CLIENT_SECRET: str
  GOOGLE_OAUTH_REDIRECT_URI: str
  BACKUP_ENABLED: bool
  BACKUP_SYSTEM_NAME: str
